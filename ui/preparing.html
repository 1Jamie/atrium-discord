<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preparing Discord</title>
  <link rel="stylesheet" href="lotus-resource://localhost/ui/theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: transparent !important;
      color: var(--atrium-text);
      font-family: var(--atrium-font-sans);
      overflow: hidden;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 24px;
      text-align: center;
      background: transparent;
    }
    h1 {
      font-size: var(--atrium-text-body);
      font-weight: 750;
      color: var(--atrium-accent);
    }
    .status {
      font-size: var(--atrium-text-secondary);
      color: var(--atrium-text-muted);
      min-height: 1.4em;
      max-width: 28em;
    }
    .status.error { color: var(--atrium-danger); }
    .status.ok { color: var(--atrium-stat-fps); }
    .bar {
      width: min(280px, 70vw);
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
      border: 1px solid var(--atrium-border-subtle);
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--atrium-accent);
      border-radius: inherit;
      transition: width 160ms ease;
    }
    .bar.indeterminate > i {
      width: 40%;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
  </style>
</head>
<body data-accent="chat">
  <div class="wrap atrium-fade-in">
    <h1>Preparing Discord</h1>
    <p class="status" id="status">Checking Ghostty…</p>
    <div class="bar indeterminate" id="bar"><i id="fill"></i></div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const barEl = document.getElementById('bar');
    const fillEl = document.getElementById('fill');

    function onPrep(d) {
      d = d || {};
      if (d.text) statusEl.textContent = d.text;
      statusEl.classList.toggle('error', d.kind === 'error');
      statusEl.classList.toggle('ok', d.kind === 'ok');
      if (d.percent == null || !Number.isFinite(Number(d.percent))) {
        barEl.classList.add('indeterminate');
        fillEl.style.width = '';
      } else {
        barEl.classList.remove('indeterminate');
        fillEl.style.width = Math.max(0, Math.min(100, Number(d.percent))) + '%';
      }
    }

    window.addEventListener('plugin:discord-sidecar:prep-status', (e) => onPrep(e.detail));
    const wait = setInterval(() => {
      if (!window.AtriumPlugin) return;
      clearInterval(wait);
      window.AtriumPlugin.on('prep-status', onPrep);
    }, 80);
  </script>
</body>
</html>
